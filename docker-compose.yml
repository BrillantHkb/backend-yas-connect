services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yas
      POSTGRES_PASSWORD: yas
      POSTGRES_DB: yas_connect
    ports:
      - "5433:5432"
    volumes:
      - yas_connect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yas -d yas_connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yas
      MINIO_ROOT_PASSWORD: yasminio12
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yas_connect_minio:/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI

  clamav:
    image: clamav/clamav:latest
    profiles: ["scan"]   # pas au `up` lab (scan = SKIPPED). Staging : --profile scan
    ports:
      - "3310:3310"

volumes:
  yas_connect_pg:
  yas_connect_minio:
